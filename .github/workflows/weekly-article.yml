name: Interclubs et article hebdomadaire

on:
  schedule:
    - cron: "0 17 * * 0"
  workflow_dispatch:
    inputs:
      week_start:
        description: "Lundi ciblé (AAAA-MM-JJ), vide pour la semaine suivante"
        required: false
        type: string
      status:
        description: "État de l'article WordPress"
        required: true
        default: draft
        type: choice
        options:
          - draft
          - publish

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  article:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Tester le générateur
        run: python -m unittest discover -s tests -v

      - name: Recuperer une seule fois le calendrier ICbad
        run: python -m scraper.scraper

      - name: Mettre a jour les interclubs puis publier l'article
        env:
          WP_URL: https://www.csbw.fr
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
          TARGET_WEEK: ${{ inputs.week_start }}
          PUBLICATION_STATUS: ${{ inputs.status || 'publish' }}
        run: |
          WEEK_ARGS=()
          if [ -n "$TARGET_WEEK" ]; then
            WEEK_ARGS+=(--week-start "$TARGET_WEEK")
          fi

          if [ -n "$WP_USERNAME" ] && [ -n "$WP_APPLICATION_PASSWORD" ]; then
            python -m scraper.weekly_article "${WEEK_ARGS[@]}" --data public/rencontres.json --sync-events --publish-wordpress --status "$PUBLICATION_STATUS"
          else
            echo "Identifiants WordPress absents : aperçu généré sans publication."
            python -m scraper.weekly_article "${WEEK_ARGS[@]}" --data public/rencontres.json
          fi

      - name: Conserver l'aperçu de l'article
        uses: actions/upload-artifact@v4
        with:
          name: article-hebdomadaire
          path: build-weekly
          retention-days: 14

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparer le calendrier en ligne
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: article
    steps:
      - name: Publier le calendrier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
