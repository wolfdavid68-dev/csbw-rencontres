name: Article hebdomadaire - occupation de la salle

on:
  schedule:
    - cron: "0 17 * * 0"
  workflow_dispatch:
    inputs:
      week_start:
        description: "Lundi ciblé (AAAA-MM-JJ), vide pour la semaine suivante"
        required: false
        type: string
      status:
        description: "État de l'article WordPress"
        required: true
        default: draft
        type: choice
        options:
          - draft
          - publish

permissions:
  contents: read

jobs:
  article:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Tester le générateur
        run: python -m unittest discover -s tests -v

      - name: Générer et publier l'article si nécessaire
        env:
          WP_URL: https://www.csbw.fr
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
          TARGET_WEEK: ${{ inputs.week_start }}
          PUBLICATION_STATUS: ${{ inputs.status || 'publish' }}
        run: |
          WEEK_ARGS=()
          if [ -n "$TARGET_WEEK" ]; then
            WEEK_ARGS+=(--week-start "$TARGET_WEEK")
          fi

          if [ -n "$WP_USERNAME" ] && [ -n "$WP_APPLICATION_PASSWORD" ]; then
            python -m scraper.weekly_article "${WEEK_ARGS[@]}" --publish-wordpress --status "$PUBLICATION_STATUS"
          else
            echo "Identifiants WordPress absents : aperçu généré sans publication."
            python -m scraper.weekly_article "${WEEK_ARGS[@]}"
          fi

      - name: Afficher les interclubs de la nouvelle semaine
        env:
          WP_URL: https://www.csbw.fr
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
          TARGET_WEEK: ${{ inputs.week_start }}
        run: |
          python -m scraper.scraper
          WEEK_ARGS=()
          if [ -n "$TARGET_WEEK" ]; then
            WEEK_ARGS+=(--week-start "$TARGET_WEEK")
          fi

          if [ -n "$WP_USERNAME" ] && [ -n "$WP_APPLICATION_PASSWORD" ]; then
            python -m scraper.wordpress_events "${WEEK_ARGS[@]}"
          else
            echo "Identifiants WordPress absents : bloc Interclub non synchronisé."
          fi

      - name: Conserver l'aperçu de l'article
        uses: actions/upload-artifact@v4
        with:
          name: article-hebdomadaire
          path: build-weekly
          retention-days: 14
