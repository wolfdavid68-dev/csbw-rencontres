<li data-csbw-date="#_{Y-m-d}" style="list-style:none;margin:0;padding:12px;border-bottom:1px solid #e5e5e5;line-height:1.45;overflow-wrap:anywhere;">
<div class="eventDate" style="display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 10px;margin-bottom:5px;font-size:13px;font-weight:600;color:#444;">
<span style="text-transform:capitalize;">{is_long}#_{j M} – #@_{j M Y}{/is_long}{not_long}#_{l j F}{/not_long}</span>
{has_time}<span class="eventTime" style="padding:0;font-size:12px;font-weight:400;font-style:normal;color:#666;">#_EVENTTIMES</span>{/has_time}
{all_day}<span class="eventTimeTbc" style="padding:0;font-size:12px;font-weight:400;font-style:italic;color:#666;">Horaire à confirmer</span>{/all_day}
</div>
<div class="eventLink" style="margin:0 0 4px;font-size:14px;font-weight:700;line-height:1.4;">#_EVENTLINK</div>
<div class="eventLocation" style="margin:0;font-size:12px;line-height:1.5;font-style:normal;color:#666;">{has_location}📍 #_LOCATIONNAME{/has_location}{no_location}🚗 Extérieur{/no_location}</div>
</li>
