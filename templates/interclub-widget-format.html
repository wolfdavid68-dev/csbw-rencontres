<li class="csbw-ic" data-csbw-date="#_{Y-m-d}" data-csbw-time="{has_time}#_{H}#_{i}{/has_time}" data-csbw-title="#_EVENTNAME" style="list-style:none;hyphens:manual;margin:0;padding:10px 12px;border-bottom:1px solid #eee;line-height:1.4;overflow-wrap:anywhere;display:flex;gap:12px;align-items:center;">
<div class="eventTime" style="flex:none;width:46px;text-align:center;font-size:14px;font-weight:700;font-style:normal;color:#333;">{has_time}#_{G}h#_{i}{/has_time}{all_day}<span style="font-size:11px;font-weight:400;font-style:italic;color:#777;">à confirmer</span>{/all_day}</div>
<div style="flex:1;min-width:0;">
<div class="eventDate" style="margin-bottom:2px;font-size:12px;font-weight:700;color:#d70100;text-transform:capitalize;">#_{l j F}</div>
<div class="eventLink" style="margin:0;font-size:14px;font-weight:700;line-height:1.3;">#_EVENTLINK</div>
<div class="eventLocation" style="margin-top:3px;font-style:normal;font-size:12px;line-height:1.5;color:#777;">{has_location}<span class="csbw-ic-badge" style="display:inline-block;margin-right:6px;padding:0 6px;border-radius:3px;background:#d70100;color:#fff;font-size:10.5px;font-weight:700;text-transform:uppercase;">Domicile</span>#_LOCATIONNAME{/has_location}{no_location}<span class="csbw-ic-badge csbw-ic-away" style="display:inline-block;margin-right:6px;padding:0 6px;border-radius:3px;background:#e8e8e8;color:#555;font-size:10.5px;font-weight:700;text-transform:uppercase;">Extérieur</span>{has_att_salle}<span class="csbw-ic-salle">#_ATT{salle}</span>{/has_att_salle}{/no_location}</div>
</div>
</li>
