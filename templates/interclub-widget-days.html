<script>(function(){function g(){var a=document.querySelectorAll("li.csbw-ic");if(!a.length||document.querySelector(".csbw-ic-day"))return;var n={},l=null;Array.prototype.forEach.call(a,function(i){var d=i.getAttribute("data-csbw-date");n[d]=(n[d]||0)+1});Array.prototype.forEach.call(a,function(i){var d=i.getAttribute("data-csbw-date"),t=(i.getAttribute("data-csbw-title")||"").trim(),b=i.querySelector(".csbw-ic-away"),s=i.querySelector(".csbw-ic-salle");if(b&&t.indexOf("CSBW ")===0){var v=s?s.textContent:"";v=(v.indexOf(",")===-1?v.split(" - "):v.split(",")).pop().trim();b.textContent=v?"Reçoit à "+v:"Reçoit";b.className+=" csbw-ic-hosts"}if(d!==l){var h=document.createElement("li"),c=document.createElement("span"),e=i.querySelector(".eventDate");h.className="csbw-ic-day";h.textContent=e?e.textContent.trim():d;c.textContent="· "+n[d]+(n[d]===1?" rencontre":" rencontres");h.appendChild(c);i.parentNode.insertBefore(h,i);l=d}i.parentNode.className+=" csbw-ic-grouped"})}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",g);else g()})();</script>
<!-- csbw-interclub-days:end -->
